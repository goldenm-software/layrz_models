version: 1
transforms:
  - title: "Rename from ReportTemplateSource to ReportSource"
    date: 2025-12-02
    element:
      uris: ["layrz_models.dart"]
      class: "ReportTemplateSource"
    changes:
      - kind: rename
        newName: "ReportSource"
  - title: "Rename from ReportTemplateAlgorithm to ReportAlgorithm"
    date: 2025-12-02
    element:
      uris: ["layrz_models.dart"]
      class: "ReportTemplateAlgorithm"
    changes:
      - kind: rename
        newName: "ReportAlgorithm"
  - title: "Replace LayrzAppLocalizations with LayrzI18n"
    date: 2026-08-17
    element:
      uris: ["layrz_models.dart"]
      class: "LayrzAppLocalizations"
    changes:
      - kind: 'replacedBy'
        newElement:
          uris: ["package:layrz_i18n/layrz_i18n.dart"]
          class: "LayrzI18n"
